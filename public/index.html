<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tienda CRM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="locked">

<div id="login">
  <form id="lForm" class="cardx">
    <div class="brand"><i class="bi bi-shop"></i> Tienda <span>CRM</span></div>
    <p class="text-secondary small mb-4">Inicia sesión para continuar</p>
    <label class="form-label">Usuario</label>
    <input class="form-control mb-3" name="usuario" required autofocus autocomplete="username">
    <label class="form-label">Contraseña</label>
    <input class="form-control mb-3" type="password" name="password" required autocomplete="current-password">
    <div class="text-danger small mb-2" id="lErr"></div>
    <button class="btn btn-primary w-100">Entrar</button>
  </form>
</div>

<aside id="side" class="d-none d-lg-flex">
  <div class="brand"><i class="bi bi-shop"></i> Tienda <span>CRM</span></div>
  <nav id="nav"></nav>
  <div class="ok"><i class="bi bi-circle-fill"></i> Sistema operativo</div>
</aside>
<main>
  <header class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <div class="d-lg-none mb-2"><select id="navSel" class="form-select form-select-sm"></select></div>
      <h1 id="title" class="h3 mb-0"></h1><p id="sub" class="text-secondary mb-0 small"></p>
    </div>
    <div class="user">
      <span class="avatar" id="uAv">M</span>
      <div class="d-none d-sm-block lh-1"><b id="uName"></b><br><small class="text-secondary" id="uRol"></small></div>
      <button class="btn btn-sm btn-light ms-3" id="logout" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
    </div>
  </header>
  <div id="view"></div>
</main>

<div class="modal fade" id="modal" tabindex="-1"><div class="modal-dialog"><form class="modal-content" id="mForm">
  <div class="modal-header"><h5 class="modal-title" id="mTitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
  <div class="modal-body" id="mBody"></div>
  <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button><button class="btn btn-primary">Guardar</button></div>
</form></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
